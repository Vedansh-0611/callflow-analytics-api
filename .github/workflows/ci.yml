name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: callflow
          POSTGRES_PASSWORD: callflow
          POSTGRES_DB: callflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://callflow:callflow@localhost:5432/callflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests (Postgres)
        run: pytest -v

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (web, worker, postgres, redis)
        run: docker compose up --build -d

      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health/ && exit 0
            sleep 2
          done
          docker compose logs web
          exit 1

      - name: Send signed webhooks and check the worker summarized the call
        run: |
          python3 scripts/send_event.py | tee out.txt
          call_url=$(grep -o 'http://localhost:8000/api/calls/[a-z0-9_]*/' out.txt)
          for i in $(seq 1 15); do
            if curl -s "$call_url" | grep -q '"summarized_at":"20'; then
              curl -s "$call_url"; exit 0
            fi
            sleep 2
          done
          docker compose logs worker
          exit 1

      - name: Stop the stack
        if: always()
        run: docker compose down -v
