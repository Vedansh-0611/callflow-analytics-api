# Production image, run locally: web (gunicorn), worker (Celery), Postgres, Redis.
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgres://callflow:callflow@postgres:5432/callflow
    REDIS_URL: redis://redis:6379/0
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: compose-local-only-not-a-real-secret
    # Plain http on localhost, so no https redirect or secure cookies.
    DJANGO_SECURE_SSL: "false"
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"
    CORS_ALLOWED_ORIGINS: http://localhost:5173
    ALLOW_INSECURE_WEBHOOK_URLS: "true"
    LOG_FORMAT: json
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app
    command: web
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: worker
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callflow
      POSTGRES_PASSWORD: callflow
      POSTGRES_DB: callflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callflow"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
