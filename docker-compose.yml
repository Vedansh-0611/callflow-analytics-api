x-app: &app
  build: .
  environment:
    DATABASE_URL: postgres://callflow:callflow@postgres:5432/callflow
    CELERY_BROKER_URL: redis://redis:6379/0
    DJANGO_DEBUG: "true"
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"
    CORS_ALLOWED_ORIGINS: http://localhost:5173
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callflow
      POSTGRES_PASSWORD: callflow
      POSTGRES_DB: callflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callflow"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
